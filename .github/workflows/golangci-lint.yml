name: Lint (golangci-lint)
on:
  push:
    tags:
      - v*
    branches:
      - master
      - develop
      - 'releases/**'
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # v4 handles full clone + tag fetching natively via fetch-depth/fetch-tags,
      # replacing the old v2 + separate `git fetch --prune --unshallow --tags` step
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # generate-backend runs natively (just go generate + touch-ui) — no Docker needed
      - name: Generate Backend
        run: make generate-backend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
